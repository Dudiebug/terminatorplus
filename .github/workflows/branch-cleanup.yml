name: Temporary branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Delete audited stale branches
        shell: bash
        run: |
          set -u
          branches=(
            'agent/debloat-audit-findings'
            'codex/fix-bot-placement-and-skins'
            'claude/stoic-bohr-fSBHq'
            'mc-26.1'
            'mc-26.1.1'
            'release/5.1.0'
            'codex/standardize-combat-telemetry'
            'codex/docs-update-readme-wiki-5.1.0'
            'claude/fix-attack-cooldown-5n6I0'
            'claude/fix-mace-attack-speed-gzmxj'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              if git push origin --delete "$branch"; then
                echo "Deleted $branch"
              else
                echo "::warning::Failed to delete $branch"
              fi
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'terminatorplus-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/branch-cleanup.yml
          git commit -m 'Remove temporary branch cleanup workflow'
          git push origin HEAD:master
