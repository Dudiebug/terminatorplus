name: Temporary Claude branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/claude-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Delete remaining obsolete Claude refs through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          for ref in \
            'claude/fix-attack-cooldown-5n6I0' \
            'claude/fix-mace-attack-speed-gzmxj'
          do
            encoded_ref="${ref//\//%2F}"
            code="$(curl -sS -o /tmp/delete-response.txt -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/git/refs/heads/$encoded_ref")"
            echo "DELETE $ref -> HTTP $code"
            if [[ "$code" != '204' && "$code" != '404' ]]; then
              cat /tmp/delete-response.txt || true
              echo "::warning::GitHub refused deletion of $ref"
            fi
          done

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'terminatorplus-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/claude-branch-cleanup.yml
          git commit -m 'Remove temporary Claude branch cleanup workflow'
          git push origin HEAD:master
