name: Temporary default branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/default-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Make master default and remove mc-26.2 if authorized
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          body='{"default_branch":"master"}'
          code="$(curl -sS -o /tmp/repo-update.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO" \
            -d "$body")"
          echo "Default-branch update -> HTTP $code"
          if [[ "$code" == '200' ]]; then
            delete_code="$(curl -sS -o /tmp/ref-delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/git/refs/heads/mc-26.2")"
            echo "mc-26.2 delete -> HTTP $delete_code"
            if [[ "$delete_code" != '204' && "$delete_code" != '404' ]]; then
              cat /tmp/ref-delete.json || true
              echo "::warning::Default changed, but GitHub refused deleting mc-26.2"
            fi
          else
            cat /tmp/repo-update.json || true
            echo "::warning::GitHub token cannot change repository default branch; mc-26.2 was not deleted"
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'terminatorplus-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/default-branch-cleanup.yml
          git commit -m 'Remove temporary default branch cleanup workflow'
          git push origin HEAD:master
