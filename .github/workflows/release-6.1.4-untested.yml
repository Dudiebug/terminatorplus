name: "Release 6.1.4 [UNTESTED]"

on:
  push:
    branches:
      - agent/debloat-audit-findings
    paths:
      - .github/workflows/release-6.1.4-untested.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -q

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.1.4-mc26.1.2
          target_commitish: ${{ github.sha }}
          name: "6.1.4-BETA for Minecraft 26.1.2 [UNTESTED]"
          body: |
            This release distinguishes CI compilation from runtime/gameplay testing.

            CI compilation and packaging completed with `./gradlew build -q` in GitHub Actions. Runtime and gameplay testing were not performed for this release.

            This release includes the existing debloat-audit changes. The lowest-priority fist fallback remains in place. Full hotbars are preserved rather than evicted.
          prerelease: true
          make_latest: false
          files: build/libs/TerminatorPlus-6.1.4-BETA-mc26.1.2.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
